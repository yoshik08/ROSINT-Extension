name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint, test, build, web-ext lint
        run: npm run check
      - name: Packaged Chromium smoke test
        run: |
          npx playwright install --with-deps chromium
          npm run ext:test:e2e
      - name: Upload store packages
        uses: actions/upload-artifact@v7
        with:
          name: rosint-packages
          path: |
            extension/dist/rosint-chrome.zip
            extension/dist/rosint-firefox.zip
            extension/dist/rosint-source-*.zip
          if-no-files-found: error
